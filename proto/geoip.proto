syntax = "proto3";

package geoip;

option go_package = "github.com/VariatezzZ/geoip/internal/xraydat";

message CIDR {
  // IP address. It must be either 4 or 16 bytes.
  bytes ip = 1;

  // Number of leading one bits in the network mask.
  uint32 prefix = 2;
}

message GeoIP {
  string country_code = 1;
  repeated CIDR cidr = 2;
}

message GeoIPList {
  repeated GeoIP entry = 1;
}
